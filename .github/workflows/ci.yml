name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify

  schema:
    name: Schema (MySQL 8 smoke test)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: minigit_smoke
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Wait until MySQL accepts TCP connections
        run: |
          for i in $(seq 1 60); do
            mysql -h127.0.0.1 -uroot -proot -e "SELECT 1" minigit_smoke >/dev/null 2>&1 && exit 0
            sleep 2
          done
          echo "MySQL never came up"; exit 1
      - name: Apply every migration in order, then the smoke test
        run: |
          for f in $(ls backend/src/main/resources/db/migration/V*__*.sql | sort -V); do
            echo "== $f"; mysql -h127.0.0.1 -uroot -proot minigit_smoke < "$f"
          done
          mysql -h127.0.0.1 -uroot -proot minigit_smoke < backend/src/test/resources/schema-smoke.sql

  frontend:
    name: Frontend (build + graph layout check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run build
      - run: node src/lib/layoutGraph.check.mjs
